<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><title>SobhanRPlay | بازی کن!</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151e32;--line:#293650;--text:#f4f7ff;--muted:#a9b6cc;--accent:#7c9cff;--good:#42d6a4}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 15% 8%,#263b70 0,transparent 30%),radial-gradient(ellipse at 88% 24%,#183e50 0,transparent 27%),var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100vh}
header{padding:34px 18px 22px;text-align:center}h1{font-size:clamp(32px,7vw,52px);margin:0 0 10px;letter-spacing:-1px}h1 span{color:var(--accent);text-shadow:0 0 24px #7c9cff66}header p{color:var(--muted);margin:0;font-size:15px}
main{max-width:1100px;margin:auto;padding:12px 18px 50px}.top{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:12px 0 20px;padding:15px;background:#121d31cc;border:1px solid #344563;border-radius:18px}
input{background:#0d1528;border:1px solid var(--line);color:white;border-radius:12px;padding:12px 14px;font:inherit;min-width:220px;flex:1;outline:none;transition:.2s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #7c9cff22}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.game{position:relative;overflow:hidden;background:linear-gradient(145deg,#1c2b47,#111a2c 75%);border:1px solid #30415f;border-radius:19px;padding:18px;text-align:right;cursor:pointer;color:inherit;transition:transform .2s,border-color .2s,box-shadow .2s;min-height:126px}
.game:before{content:"";position:absolute;width:90px;height:90px;border-radius:50%;background:#7c9cff12;left:-28px;top:-32px;transition:.25s}
.game-art{height:112px;margin:-2px -2px 13px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#ffffff26,transparent 48%),linear-gradient(135deg,#334d78,#202b49);border:1px solid #ffffff18;overflow:hidden;position:relative}.game-art:after{content:"";position:absolute;width:120px;height:120px;border:1px solid #ffffff18;border-radius:50%;box-shadow:0 0 0 16px #ffffff08,0 0 0 32px #ffffff05}.game-art span{font-size:64px;filter:drop-shadow(0 8px 9px #0008);z-index:1;transition:transform .2s}.game:hover .game-art span{transform:scale(1.13) rotate(-5deg)}
.game:hover{transform:translateY(-5px);border-color:var(--accent);box-shadow:0 12px 28px #0005}.game:hover:before{transform:scale(1.6)}
.emoji{font-size:31px;display:inline-block;filter:drop-shadow(0 4px 8px #0005)}.game h3{margin:9px 0 6px;font-size:16px}.game p{margin:0;color:var(--muted);font-size:13px;line-height:1.7}
button{font:inherit;border:0;border-radius:13px;padding:11px 17px;background:linear-gradient(135deg,#9bb3ff,#718eff);color:#081126;font-weight:bold;cursor:pointer;transition:transform .15s,filter .15s,box-shadow .15s;box-shadow:0 5px 14px #0002}
button:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 7px 18px #0003}button:active{transform:scale(.97)}
button.secondary{background:#26344e;color:var(--text);box-shadow:none}button:disabled{opacity:.45;cursor:not-allowed;transform:none}
#play{display:none;background:linear-gradient(145deg,#192741,#121c30);border:1px solid #3a4e70;border-radius:23px;padding:22px;margin:18px 0;box-shadow:0 18px 45px #0004;animation:popIn .25s ease-out}
#play h2{margin:12px 0 8px;font-size:24px}.muted{color:var(--muted)}
#arena{min-height:190px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:13px;text-align:center;margin:18px 0;padding:22px 14px;background:radial-gradient(ellipse at center,#26395888,transparent 72%),#0d1729;border:1px solid #2d3f5d;border-radius:18px}
#arena input{max-width:300px;flex:initial;width:100%;text-align:center}
#arena button{min-width:90px}.choices{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.big{font-size:clamp(38px,9vw,50px);font-weight:bold;filter:drop-shadow(0 5px 10px #0005)}
.status{color:var(--good);min-height:27px;text-align:center;font-weight:bold;padding:4px;animation:fadeIn .2s ease}
.game-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:30px;padding:15px}
@keyframes popIn{from{opacity:0;transform:translateY(9px) scale(.99)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media(max-width:520px){header{padding-top:24px}.top{align-items:stretch;padding:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.game{padding:14px;min-height:120px}#play{padding:14px}#arena{padding:17px 10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

#resultOverlay{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;padding:20px;background:#050914d9;backdrop-filter:blur(9px);animation:fadeIn .2s ease}
.result-card{width:min(100%,390px);text-align:center;padding:30px 22px;border:1px solid #ff668866;border-radius:25px;background:linear-gradient(145deg,#392039,#171d32);box-shadow:0 20px 70px #0009;animation:popIn .28s ease-out}
.result-card .lose-emoji{font-size:66px;animation:shake .45s ease}.result-card h2{font-size:36px;color:#ff8495;margin:10px 0}.result-card p{color:#e8dce5;line-height:1.8;margin:8px 0 20px}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}40%{transform:rotate(9deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(6deg)}}
</style></head>
<body>
<header><h1>🎮 <span>SobhanR</span>Play</h1><p>۲۵ بازی جذاب و تک‌نفره؛ رایگان و بدون نصب!</p></header>
<main><div class="top"><div><b>بازی مورد علاقه‌ات را انتخاب کن</b><div class="muted" style="font-size:13px;margin-top:5px">رکوردها روی همین دستگاه ذخیره می‌شوند.</div></div><input id="search" placeholder="🔎 جست‌وجوی بازی..." oninput="filterGames()"></div>
<section id="play"><button class="secondary" onclick="back()">← بازگشت به بازی‌ها</button><h2 id="gameTitle"></h2><div class="muted" id="gameDesc"></div><div id="arena"></div><div class="status" id="status" aria-live="polite"></div><div class="game-actions"><button id="replayBtn" onclick="replayGame()">🔄 بازی دوباره / دور بعدی</button><button class="secondary" onclick="back()">فهرست بازی‌ها</button></div></section>
<section class="grid" id="games"></section><div class="foot">ساخته‌شده با ❤️ برای SobhanRPlay</div></main>
<script>
const games=[
['🎯','هدف‌گیری','هدف را پیدا کن و با کلیک‌های دقیق امتیاز جمع کن.','target'],['🔢','حدس عدد','عدد مخفی بین ۱ تا ۱۰۰ را با راهنمایی‌های بازی حدس بزن.','guess'],['🧠','حافظه','رنگ‌ها و ترتیب نمایش آن‌ها را به خاطر بسپار و تکرار کن.','memory'],['⚡','سرعت واکنش','منتظر سبز شدن صفحه بمان و در سریع‌ترین زمان کلیک کن.','reaction'],['➕','حساب سریع','مسئله‌های جمع را حل کن و سرعت محاسبه‌ات را بسنج.','math'],['⌨️','تایپ سریع','کلمه‌ی نمایش‌داده‌شده را درست و سریع تایپ کن.','type'],['🎨','شناخت رنگ','رنگ خواسته‌شده را تشخیص بده و گزینه‌ی درست را بزن.','color'],['✊','سنگ کاغذ قیچی','سنگ، کاغذ یا قیچی را انتخاب کن و با رایانه رقابت کن.','rps'],['🎲','تاس','تاس بینداز و ببین چه عددی نصیبت می‌شود.','dice'],['🪙','شیر یا خط','حدس بزن سکه روی شیر می‌ایستد یا خط.','coin'],['📈','بالاتر یا پایین‌تر','پیش‌بینی کن عدد بعدی از عدد فعلی بزرگ‌تر است یا کوچک‌تر.','higher'],['🔤','کلمه به‌هم‌ریخته','حروف درهم‌ریخته را مرتب کن و کلمه‌ی درست را بساز.','scramble'],['👀','شمارش سریع','ستاره‌ها را بشمار و تعداد درست را وارد کن.','count'],['🧩','الگوی عددی','قانون دنباله‌ی عددی را کشف کن و عدد بعدی را بنویس.','pattern'],['🔍','پیدا کردن متفاوت','شکل متفاوت را میان شکل‌های مشابه پیدا کن.','odd'],['🏁','شمارش معکوس','قبل از تمام شدن شمارش معکوس، آماده‌ی واکنش باش.','timer'],['🎯','دقت کلیک','در ده ثانیه تا می‌توانی سریع کلیک کن و رکورد بزن.','clicker'],['📚','دانش عمومی','به یک سؤال کوتاه دانش عمومی پاسخ بده.','quiz'],['🔐','رمزگشا','رمز سه‌رقمی را با راهنمایی‌های بازی کشف کن.','code'],['🌟','شانس ستاره‌ای','ستاره‌ی پنهان را از میان ابرها پیدا کن.','star'],['⭕','دوز تک‌نفره','در یک بازی دوز تک‌نفره با رایانه رقابت کن.','ttt'],['✖️','آزمون ضرب','حاصل ضرب دو عدد را سریع و دقیق حساب کن.','multiply'],['🔠','مرتب‌سازی حروف','حروف جابه‌جا شده را به شکل درست کلمه برگردان.','letters'],['🧮','زوج یا فرد','تشخیص بده عدد نمایش‌داده‌شده زوج است یا فرد.','even'],['🧭','جهت‌یابی','جهت نمایش‌داده‌شده را از میان چهار گزینه انتخاب کن.','direction'],
['🏹','کمان رنگین‌کمانی','با کشیدن انگشت مسیر کارتونی را تنظیم کن و با رها کردن تیر را پرتاب کن.','archery'],['🌀','ماز اسرارآمیز','از مسیر پیچ‌درپیچ عبور کن و به خروجی برس.','maze'],['☄️','فرار از شهاب‌سنگ','با انتخاب چپ و راست از شهاب‌سنگ‌ها دوری کن.','dodge'],['💎','شکار گنج','یکی از صندوق‌ها را انتخاب کن و گنج را پیدا کن.','treasure'],['🔤','پازل کلمات','حروف به‌هم‌ریخته را مرتب کن و کلمه را کشف کن.','wordpuzzle']
];
const $=id=>document.getElementById(id);let current=null,score=0,secret=0,interval=null,timeout=null,started=0,sequence=[],step=0;
function render(){ $('games').innerHTML=games.map((g,i)=>'<button class="game" data-name="'+g[1]+'" onclick="startGame('+i+')"><div class="game-art"><span>'+g[0]+'</span></div><h3>'+g[1]+'</h3><p>'+g[2]+'</p></button>').join('')}
function filterGames(){let q=$('search').value.trim();document.querySelectorAll('.game').forEach(el=>el.style.display=el.dataset.name.includes(q)?'block':'none')}
function stop(){clearInterval(interval);clearTimeout(timeout);interval=timeout=null}
function back(){stop();$('play').style.display='none';$('games').style.display='grid';$('search').parentElement.style.display='flex'}
function replayGame(){if(current){setup(games.indexOf(current));}}
function setup(i){current=games[i];stop();$('games').style.display='none';$('search').parentElement.style.display='none';$('play').style.display='block';$('gameTitle').textContent=current[0]+' '+current[1];$('gameDesc').textContent=current[2];$('status').textContent='';$('arena').innerHTML='';score=0;
const btn=(label,fn)=>{let b=document.createElement('button');b.textContent=label;b.onclick=fn;$('arena').append(b);return b};
const input=(placeholder='پاسخت را بنویس')=>{let x=document.createElement('input');x.placeholder=placeholder;$('arena').append(x);return x};
function playLoseSound(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),now=c.currentTime;[440,330,220].forEach((hz,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.setValueAtTime(hz,now+i*.16);g.gain.setValueAtTime(.0001,now+i*.16);g.gain.exponentialRampToValueAtTime(.16,now+i*.16+.025);g.gain.exponentialRampToValueAtTime(.0001,now+i*.16+.22);o.connect(g);g.connect(c.destination);o.start(now+i*.16);o.stop(now+i*.16+.24)});setTimeout(()=>c.close(),900)}catch(e){}}
function showLose(t){document.getElementById('resultOverlay')?.remove();playLoseSound();const layer=document.createElement('div');layer.id='resultOverlay';layer.innerHTML='<div class="result-card"><div class="lose-emoji">😵‍💫</div><h2>باختی!</h2><p>'+t+'</p><div class="game-actions"><button id="overlayReplay">🔄 دوباره بازی کن</button><button class="secondary" id="overlayBack">📋 فهرست بازی‌ها</button></div></div>';document.body.append(layer);document.getElementById('overlayReplay').onclick=()=>{layer.remove();replayGame()};document.getElementById('overlayBack').onclick=()=>{layer.remove();back()}}
const msg=t=>{$('status').textContent=t;if(/باختی|درست نشد|درست نبود|اشتباه شد|جواب درست:|پاسخ درست:|زمان تمام شد|اینجا نبود|این یکی متفاوت نیست|این بار رایانه برنده شد|حدست درست نبود/.test(t))showLose(t)};
switch(current[3]){
case'target':{let points=0,shots=0;const draw=()=>{$('arena').innerHTML='<div style="font-size:13px;color:#a9b6cc">روی هدفی که در صفحه جابه‌جا می‌شود بزن؛ ۱۰ فرصت داری!</div><div id="targetZone" style="position:relative;width:100%;height:190px;overflow:hidden;border-radius:14px;background:linear-gradient(#152a46,#0b172a)"><div id="movingTarget" role="button" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:48px;cursor:pointer;touch-action:manipulation">🎯</div></div><div style="font-weight:bold">امتیاز: <span id="targetScore">0</span> | فرصت: <span id="targetShots">0</span>/10</div>';let t=$('movingTarget');t.style.left=(12+Math.random()*76)+'%';t.style.top=(15+Math.random()*70)+'%';t.onclick=e=>{e.stopPropagation();if(shots>=10)return;shots++;points+=10;$('targetScore').textContent=points;$('targetShots').textContent=shots;if(shots>=10){msg('🏆 تمام شد! امتیاز تو: '+points+' از ۱۰۰');return}t.style.left=(12+Math.random()*76)+'%';t.style.top=(15+Math.random()*70)+'%';t.style.fontSize=(38+Math.random()*22)+'px';$('status').textContent='آفرین! هدف را زدی. ادامه بده!'}};draw();break}
case'guess':secret=1+Math.floor(Math.random()*100);{let x=input('یک عدد از ۱ تا ۱۰۰');btn('بررسی',()=>{let v=+x.value;if(!v||v>100){msg('یک عدد معتبر وارد کن.');return}msg(v===secret?'🎉 درست حدس زدی!':v<secret?'عدد بزرگ‌تری بگو.':'عدد کوچک‌تری بگو.')});break}
case'memory':sequence=Array.from({length:5},()=>Math.floor(Math.random()*4));step=0;$('arena').innerHTML='<div class="big">🔴 🟢 🔵 🟡</div><p>ترتیب شماره رنگ‌ها: '+sequence.map(x=>x+1).join(' - ')+'</p>';timeout=setTimeout(()=>{$('arena').innerHTML='';let x=input('شماره‌ها را پشت سر هم بنویس');btn('بررسی',()=>msg(x.value.replace(/\s/g,'')===sequence.map(v=>v+1).join('')?'عالی! حافظه‌ات قویه.':'این بار درست نشد؛ دوباره تلاش کن.'))},3500);break;
case'reaction':$('arena').textContent='صبر کن تا سبز شود...';timeout=setTimeout(()=>{$('arena').innerHTML='';let b=btn('حالا کلیک کن!',()=>msg('زمان واکنش: '+(Date.now()-started-2000)+' میلی‌ثانیه'));b.style.background='#42d6a4';started=Date.now()},2000);break;
case'math':{let a=2+Math.floor(Math.random()*48),b=2+Math.floor(Math.random()*48),x=input(a+' + '+b+' = ؟');btn('جواب',()=>msg(+x.value===a+b?'درست است! 👏':'جواب درست: '+(a+b)));break}
case'type':{let words=['آسمان','کتاب','دوستی','بازی','کامپیوتر','ستاره'];let w=words[Math.floor(Math.random()*words.length)];$('arena').innerHTML='<div class="big">'+w+'</div>';let x=input('کلمه را تایپ کن');btn('بررسی',()=>msg(x.value===w?'عالی تایپ کردی!':'دوباره تلاش کن.'));break}
case'color':{let cs=['قرمز','آبی','سبز','زرد'];let c=cs[Math.floor(Math.random()*4)];$('arena').innerHTML='<div class="big">'+c+'</div><p>این کلمه چه رنگی است؟</p>';cs.sort(()=>Math.random()-.5).forEach(v=>btn(v,()=>msg(v===c?'درست گفتی!':'اشتباه شد؛ دوباره بازی کن.')));break}
case'rps':{['✊ سنگ','✋ کاغذ','✌️ قیچی'].forEach((v,i)=>btn(v,()=>{let c=Math.floor(Math.random()*3);msg(['مساوی!','بردی! 🎉','باختی؛ دوباره تلاش کن.'][(i-c+3)%3===0?0:(i-c+3)%3===1?1:2]+' انتخاب رایانه: '+['سنگ','کاغذ','قیچی'][c])}));break}
case'dice':btn('🎲 تاس بینداز',()=>msg('عدد تاس: '+(1+Math.floor(Math.random()*6))));break;
case'coin':['شیر','خط'].forEach(v=>btn(v,()=>{let c=Math.random()<.5?'شیر':'خط';msg('نتیجه: '+c+(v===c?'؛ آفرین، درست حدس زدی!':'؛ این بار نشد.'))}));break;
case'higher':secret=1+Math.floor(Math.random()*10);$('arena').innerHTML='<div class="big">'+secret+'</div><p>عدد بعدی بین ۱ تا ۱۰ است. بزرگ‌تر یا کوچک‌تر؟</p>';['بزرگ‌تر','کوچک‌تر'].forEach((v,i)=>btn(v,()=>{let n=1+Math.floor(Math.random()*10);msg('عدد بعدی '+n+' بود؛ '+(n===secret?'برابر شد!':(n>secret)===(i===0)?'درست حدس زدی!':'حدست درست نبود.'))}));break;
case'scramble':{let pairs=[['باتک','کتاب'],['زیبا','بازی'],['راتس','ستار'],['تسود','دوست']];let p=pairs[Math.floor(Math.random()*pairs.length)],x=input('کلمه درست');$('arena').innerHTML='<div class="big">'+p[0]+'</div>'; $('arena').append(x);btn('بررسی',()=>msg(x.value===p[1]?'آفرین!':'پاسخ: '+p[1]));break}
case'count':{let n=3+Math.floor(Math.random()*8);$('arena').innerHTML='<div class="big">'+('⭐'.repeat(n))+'</div>';let x=input('چند ستاره دیدی؟');btn('بررسی',()=>msg(+x.value===n?'درست شمردی!':'تعداد درست '+n+' بود.'));break}
case'pattern':{let a=2+Math.floor(Math.random()*8),d=2+Math.floor(Math.random()*5),x=input('عدد بعدی چیست؟');$('arena').innerHTML='<div class="big">'+[a,a+d,a+2*d,a+3*d].join('، ')+'</div>'; $('arena').append(x);btn('بررسی',()=>msg(+x.value===a+4*d?'الگو را پیدا کردی!':'پاسخ '+(a+4*d)+' است.'));break}
case'odd':{let odd=Math.floor(Math.random()*9);for(let j=0;j<9;j++)btn(j===odd?'🍎':'🍏',()=>msg(j===odd?'پیداش کردی!':'این یکی متفاوت نیست.'));break}
case'timer':{let n=5;$('arena').innerHTML='<div class="big" id="countdown">۵</div>';interval=setInterval(()=>{n--;$('countdown').textContent=n;if(n<=0){stop();msg('زمان تمام شد!')}},1000);break}
case'clicker':{let n=0,b=btn('هرچه می‌توانی کلیک کن!',()=>{n++;b.textContent='کلیک‌ها: '+n});started=Date.now();timeout=setTimeout(()=>{b.disabled=true;msg('در ۱۰ ثانیه '+n+' بار کلیک کردی!')},10000);break}
case'quiz':{let qs=[['بزرگ‌ترین سیاره منظومه شمسی کدام است؟','مشتری',['زمین','مریخ','مشتری']],['یک هفته چند روز دارد؟','۷',['۵','۶','۷']],['حاصل ۶×۷ چیست؟','۴۲',['۳۶','۴۲','۴۸']],['پایتخت فرانسه کدام شهر است؟','پاریس',['رم','پاریس','برلین']],['کدام جانور پستاندار است؟','دلفین',['کوسه','دلفین','اختاپوس']],['آب در چند درجه سانتی‌گراد یخ می‌زند؟','۰',['۰','۱۰','۱۰۰']],['کدام سیاره به سیاره سرخ معروف است؟','مریخ',['زهره','مریخ','زحل']],['سه ضلع چه شکلی را می‌سازند؟','مثلث',['مربع','دایره','مثلث']],['کدام اقیانوس بزرگ‌تر است؟','آرام',['اطلس','هند','آرام']],['حاصل ۹×۸ چیست؟','۷۲',['۶۴','۷۲','۸۱']],['گیاهان برای رشد به کدام مورد نیاز دارند؟','نور خورشید',['نور خورشید','پلاستیک','آهن']],['کدام فصل پس از بهار می‌آید؟','تابستان',['زمستان','تابستان','پاییز']],['یک ساعت چند دقیقه است؟','۶۰',['۳۰','۶۰','۹۰']],['کدام وسیله زمان را نشان می‌دهد؟','ساعت',['قطب‌نما','ساعت','دماسنج']],['کدام عدد زوج است؟','۲۴',['۱۳','۲۱','۲۴']]];let asked=[];const next=()=>{if(asked.length===qs.length){$('arena').innerHTML='<div class="big">🏆</div><p>همه‌ی سؤال‌ها تمام شد!</p>';msg('آزمون به پایان رسید.');return}let ids=qs.map((_,i)=>i).filter(i=>!asked.includes(i)),id=ids[Math.floor(Math.random()*ids.length)];asked.push(id);let q=qs[id];$('arena').innerHTML='<p style="font-size:18px">'+(asked.length)+'. '+q[0]+'</p>';q[2].forEach(v=>btn(v,()=>{if(v===q[1]){score++;$('status').textContent='آفرین! امتیاز: '+score;next()}else{$('status').textContent='پاسخ درست: '+q[1]+' | امتیاز: '+score;next()}}));};next();break}
case'code':secret=100+Math.floor(Math.random()*900);{let x=input('رمز سه‌رقمی');btn('باز کردن قفل',()=>{let v=+x.value;msg(v===secret?'🔓 قفل باز شد!':v<secret?'رمز بزرگ‌تری است.':'رمز کوچک‌تری است.')});break}
case'star':{let win=Math.floor(Math.random()*6);for(let j=0;j<6;j++)btn(j===win?'🌟':'☁️',()=>msg(j===win?'⭐ پیداش کردی! برنده شدی!':'اینجا نبود؛ یک جای دیگر را امتحان کن.'));break}
case'multiply':{let a=2+Math.floor(Math.random()*12),b=2+Math.floor(Math.random()*12),x=input(a+' × '+b+' = ؟');btn('بررسی',()=>msg(+x.value===a*b?'آفرین، درست است!':'جواب درست '+(a*b)+' است.'));break}
case'even':{let n=1+Math.floor(Math.random()*99);$('arena').innerHTML='<div class="big">'+n+'</div><p>این عدد زوج است یا فرد؟</p>';['زوج','فرد'].forEach(v=>btn(v,()=>msg((n%2===0?'زوج':'فرد')===v?'درست گفتی!':'پاسخ درست: '+(n%2===0?'زوج':'فرد'))));break}
case'letters':{let words=['سیب','ماه','گل','آب'];let w=words[Math.floor(Math.random()*words.length)];$('arena').innerHTML='<div class="big">'+w.split('').reverse().join(' · ')+'</div>';let x=input('کلمه را درست بنویس');btn('بررسی',()=>msg(x.value.trim()===w?'آفرین!':'پاسخ درست: '+w));break}
case'direction':{let dirs=['⬆️ بالا','⬇️ پایین','⬅️ چپ','➡️ راست'];let d=Math.floor(Math.random()*4);$('arena').innerHTML='<div class="big">'+dirs[d].split(' ')[0]+'</div><p>جهت نمایش‌داده‌شده را انتخاب کن.</p>';dirs.forEach((v,i)=>btn(v,()=>msg(i===d?'درست انتخاب کردی!':'یک بار دیگر دقت کن.')));break}
case'archery':{let angle=0,targetY=100,shots=0,hits=0;const draw=()=>{$('arena').innerHTML='<p>انگشتت را روی صفحه نگه دار و بالا یا پایین بکش؛ با رها کردن، تیر کارتونی پرتاب می‌شود.</p><div id="archeryField" style="position:relative;width:100%;height:230px;overflow:hidden;border-radius:16px;background:linear-gradient(#142a49,#254b63 65%,#31513f 65%);touch-action:none;user-select:none"><div style="position:absolute;left:8%;bottom:25px;font-size:48px">🏹</div><div id="arrow" style="position:absolute;left:20%;top:65%;font-size:34px;transform:rotate(0deg);transform-origin:left center">➶</div><div id="archeryTarget" style="position:absolute;right:9%;top:40%;font-size:54px">🎯</div><div style="position:absolute;bottom:5px;left:38%;font-size:12px;color:#fff">میدان بازی خیالی</div></div><div>اصابت: <b id="hits">0</b> از <b id="shots">0</b> پرتاب</div><button id="resetBow" class="secondary">مرحله‌ی تازه</button>';let field=$('archeryField'),arrow=$('arrow'),target=$('archeryTarget'),drag=false,startY=0;targetY=35+Math.random()*35;target.style.top=targetY+'%';const setAngle=v=>{angle=Math.max(-32,Math.min(32,v));arrow.style.transform='rotate('+angle+'deg)'};field.onpointerdown=e=>{drag=true;startY=e.clientY;field.setPointerCapture(e.pointerId)};field.onpointermove=e=>{if(!drag)return;setAngle((startY-e.clientY)*.45)};field.onpointerup=()=>{if(!drag)return;drag=false;shots++;let desired=(50-targetY)*.45,hit=Math.abs(angle-desired)<7;if(hit)hits++;$('hits').textContent=hits;$('shots').textContent=shots;arrow.style.transition='left .35s,top .35s';arrow.style.left='72%';arrow.style.top=(65-angle*.45)+'%';msg(hit?'🎯 عالی! به هدف خورد.':'تیر به هدف نخورد؛ زاویه‌ی کارتونی را کمی تغییر بده.');setTimeout(()=>{arrow.style.transition='none';arrow.style.left='20%';arrow.style.top='65%';setAngle(0);targetY=25+Math.random()*50;target.style.top=targetY+'%'},450)};field.onpointercancel=()=>{drag=false};$('resetBow').onclick=()=>{shots=0;hits=0;$('hits').textContent='0';$('shots').textContent='0';targetY=35+Math.random()*35;target.style.top=targetY+'%';setAngle(0);msg('مرحله‌ی تازه شروع شد!')};};draw();break}
case'maze':{let pos=0,steps=0;const walls=[7,11,13,17];const draw=()=>{$('arena').innerHTML='<p>با دکمه‌ها از خانه‌ی سبز به ستاره برس.</p><div id="mazeGrid" style="display:grid;grid-template-columns:repeat(5,42px);gap:5px;justify-content:center"></div><div class="choices" id="mazeControls"></div>';for(let i=0;i<25;i++){let cell=document.createElement('div');cell.textContent=i===pos?'🟢':i===24?'⭐':walls.includes(i)?'🧱':'▫️';cell.style.cssText='height:42px;display:grid;place-items:center;background:#263650;border-radius:8px;font-size:23px';$('mazeGrid').append(cell)}[['⬆️',-5],['⬇️',5],['⬅️',-1],['➡️',1]].forEach(([v,d])=>btn(v,()=>{let n=pos+d;if(n<0||n>=25||(d===1&&pos%5===4)||(d===-1&&pos%5===0)||walls.includes(n)){msg('این مسیر بسته است!');return}pos=n;steps++;draw();if(pos===24)msg('🎉 از ماز خارج شدی! تعداد حرکت: '+steps)}))};draw();break}
case'dodge':{let round=0,life=3;const next=()=>{$('arena').innerHTML='<div class="big">🚀</div><p>شهاب‌سنگ از کدام سمت می‌آید؟ سمت امن را انتخاب کن!</p><div>جان باقی‌مانده: '+life+' | مرحله: '+(round+1)+'/8</div>';let danger=Math.random()<.5?'چپ':'راست';['چپ','راست'].forEach(side=>btn(side==='چپ'?'⬅️ چپ':'➡️ راست',()=>{if(side===danger){life--;msg('برخورد شد! یک جان کم شد.')}else msg('خوب جاخالی دادی!');round++;if(life<=0){msg('بازی تمام شد!');return}if(round>=8){msg('🏆 از میدان شهاب‌سنگ‌ها فرار کردی!');return}next()}))};next();break}
case'treasure':{let prize=Math.floor(Math.random()*3);$('arena').innerHTML='<div class="big">💎</div><p>گنج در یکی از این سه صندوق پنهان شده است. یکی را انتخاب کن!</p>';['📦 صندوق اول','🎁 صندوق دوم','🧰 صندوق سوم'].forEach((v,i)=>btn(v,()=>{if(i===prize){msg('🏆 گنج را پیدا کردی!')}else msg('این صندوق خالی بود! گنج در صندوق '+(prize+1)+' بود.')}));break}
case'wordpuzzle':{let words=[['رابتک','کتاب'],['تسود','دوست'],['مآس','آسم'],['ناتسدا','داستان'],['هراست','ستاره'],['یزاب','بازی'],['ناتخرد','درختان']];let p=words[Math.floor(Math.random()*words.length)],x=input('کلمه‌ی درست را بنویس');$('arena').innerHTML='<div class="big">'+p[0].split('').join(' · ')+'</div><p>حروف را مرتب کن.</p>'; $('arena').append(x);btn('بررسی',()=>msg(x.value.trim()===p[1]?'درست حل کردی!':'جواب درست: '+p[1]));break}
case'ttt':{let board=Array(9).fill(''),over=false;let winLines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let draw=()=>{$('arena').innerHTML='';board.forEach((v,i)=>{let b=btn(v||'　',()=>{if(over||board[i])return;board[i]='❌';draw();if(check('❌')){over=true;msg('تو برنده شدی!');return}if(board.every(Boolean)){over=true;msg('مساوی شد!');return}let free=board.map((v,j)=>v?null:j).filter(v=>v!==null);let move=free[Math.floor(Math.random()*free.length)];board[move]='⭕';draw();if(check('⭕')){over=true;msg('این بار رایانه برنده شد.');return}if(board.every(Boolean)){over=true;msg('مساوی شد!')}});b.style.width='64px';b.style.height='58px';b.style.fontSize='22px'})};let check=s=>winLines.some(line=>line.every(i=>board[i]===s));draw();msg('تو ❌ هستی؛ یک خانه را انتخاب کن.');break}
}}
function startGame(i){setup(i)}render();
</script></body></html>
